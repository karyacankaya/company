# GitHub Pages'e otomatik yayın
# ------------------------------------------------------------------
# main dalına her "git push" yapıldığında GitHub:
#   1. projeyi indirir, bağımlılıkları kurar (npm ci)
#   2. oyunu derler (npm run build → dist/ klasörü)
#   3. dist/ klasörünü GitHub Pages'te yayınlar
# İlerlemeyi deponun "Actions" sekmesinden izleyebilirsin.
# ------------------------------------------------------------------
name: GitHub Pages'e yayınla

on:
  push:
    branches: [main]
  workflow_dispatch: # Actions sekmesinden elle de çalıştırılabilsin

# Pages'e yazabilmek için gereken izinler
permissions:
  contents: read
  pages: write
  id-token: write

# Aynı anda iki yayın çakışmasın
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Oyunu derle
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
